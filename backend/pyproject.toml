[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-email-agent"
version = "0.1.0"
description = "AI-powered multi-agent email management system"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "langgraph==0.2.60",
    "google-generativeai==0.8.3",
    "openai==1.58.1",
    "chromadb==0.5.23",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "cryptography==44.0.0",
    "asyncpg==0.30.0",
    "websockets==14.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.119.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "aiosqlite==0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "property: property-based tests",
    "integration: integration tests",
    "performance: performance tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
